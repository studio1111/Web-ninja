name: Import KAGE project archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract and replace project files
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="KAGE-project.zip"
          test -f "$ARCHIVE" || { echo "KAGE-project.zip is missing from the repository root."; exit 1; }
          mkdir -p /tmp/kage-unpack
          unzip -q "$ARCHIVE" -d /tmp/kage-unpack

          # The supplied archive stores the site under kage-site/.
          if [ -d /tmp/kage-unpack/kage-site ]; then
            SOURCE="/tmp/kage-unpack/kage-site"
          else
            SOURCE="/tmp/kage-unpack"
          fi

          # Replace repository project files while preserving Git metadata and
          # the workflow needed to run this import. The uploaded ZIP is temporary.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'KAGE-project.zip' -exec rm -rf {} +
          shopt -s dotglob
          for item in "$SOURCE"/*; do
            [ -e "$item" ] || continue
            name="$(basename "$item")"
            if [ "$name" = ".github" ]; then
              mkdir -p .github
              cp -a "$item"/. .github/
            else
              cp -a "$item" .
            fi
          done

          rm -f "$ARCHIVE"
          test -f package.json || { echo "Import check failed: package.json not found at repository root."; exit 1; }

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Import complete KAGE project from archive"
            git push
          fi
